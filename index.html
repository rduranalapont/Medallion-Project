<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medallion Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="juego">
    <!-- Canvas: fondo y medalla (lo visual del juego) -->
    <canvas id="lienzo" width="960" height="540"></canvas>

    <!-- UI en HTML/CSS encima del canvas -->
    <div id="ui">
      <div id="barra-superior">
        <!-- Silencio: altavoz (con ondas) / altavoz tachado -->
        <button id="btn-silencio" class="icono" aria-pressed="false" aria-label="Silenciar" title="Silenciar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4V5z"/>
            <path class="onda" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
            <path class="tacha" d="M16 9l6 6M22 9l-6 6"/>
          </svg>
        </button>
        <!-- Pantalla completa: esquinas hacia fuera / hacia dentro -->
        <button id="btn-pantalla" class="icono" aria-pressed="false" aria-label="Pantalla completa" title="Pantalla completa">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="expandir" d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
            <path class="comprimir" d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/>
          </svg>
        </button>
      </div>

      <div id="info-personaje"></div>

      <div id="velo"></div>

      <!-- Disquete: guardar la partida (visible en todos los menús salvo el título) -->
      <button id="btn-guardar" class="cuadro-guardar" hidden aria-label="Guardar partida" title="Guardar partida">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>   <!-- fundido a negro entre pantallas -->

      <!-- 1) Pantalla de título: "pulsa para empezar" -->
      <section id="pantalla-inicio" class="pantalla" hidden>
        <h1 class="titulo-grande">Medallion<br>Project</h1>
        <p class="subtitulo-inicio">Demo</p>
        <p class="pulsa">Haz clic o pulsa cualquier tecla para empezar</p>
      </section>

      <!-- 2) Menú principal -->
      <section id="pantalla-principal" class="pantalla" hidden>
        <h1>Medallion Project</h1>
        <div id="lista-opciones">
          <button id="op-capitulos" class="opcion item" style="--i:0"><span class="titulo">Capítulos</span><span class="sub">Elige tu próxima batalla</span></button>
          <button id="op-bestiario" class="opcion item proximamente" style="--i:1"><span class="titulo">Bestiario</span><span class="sub">Próximamente</span></button>
          <button id="op-ajustes" class="opcion item" style="--i:2"><span class="titulo">Ajustes</span><span class="sub">Sonido y partida guardada</span></button>
        </div>
      </section>

      <!-- 3) Selección de capítulos -->
      <section id="pantalla-capitulos" class="pantalla" hidden>
        <h1>Medallion Project</h1>
        <div id="lista-capitulos"></div>
        <div id="fila-inferior">
          <button id="btn-volver-principal" class="boton item" style="--i:3">Volver</button>
          <button id="btn-intro" class="boton item" style="--i:4">Introducción</button>
        </div>
      </section>

      <section id="pantalla-ajustes" class="pantalla" hidden>
        <h2>Ajustes</h2>
        <div id="lista-sliders"></div>
        <h3>Partida guardada</h3>
        <p id="estado-archivo" class="nota"></p>
        <div class="fila-botones">
          <button id="btn-elegir" class="boton">Elegir archivo</button>
          <button id="btn-importar" class="boton">Cargar partida</button>
          <button id="btn-borrar" class="boton">Borrar datos</button>
        </div>
        <input id="archivo-partida" type="file" accept=".txt,text/plain" hidden>
        <button id="btn-volver" class="boton">Volver</button>
      </section>

      <section id="pantalla-combate" class="pantalla" hidden>
        <div id="orden-turnos" aria-label="Orden de turnos"></div>

        <div id="hud-enemigo" class="hud item desde-der">
          <div id="e-nombre" class="nombre-hud"></div>
          <div id="e-vida" class="vida-texto"></div>
          <div class="barra"><div id="e-barra" class="relleno"></div></div>
        </div>

        <p id="mensaje-combate" role="status"></p>

        <div id="hud-jugador" class="hud item desde-izq">
          <div id="j-retrato" aria-hidden="true"></div> <!-- placeholder: aquí irá la imagen del personaje -->
          <div class="datos">
            <div id="j-nombre" class="nombre-hud"></div>
            <div id="j-vida" class="vida-texto"></div>
            <div class="barra"><div id="j-barra" class="relleno"></div></div>
          </div>
        </div>

        <div id="acciones" class="item desde-der" style="--i:1">
          <button class="boton" data-accion="atacar">Atacar</button>
          <button id="btn-secundaria" class="boton" data-accion="defender">Defender</button>
          <button class="boton" data-accion="huir">Huir</button>
        </div>

        <div id="resultado" hidden>
          <h2 id="resultado-titulo"></h2>
          <div class="fila">
            <button id="btn-reintentar" class="boton">Reintentar</button>
            <button id="btn-salir" class="boton">Volver al menú</button>
          </div>
        </div>
      </section>

      <section id="pantalla-escena" class="pantalla" hidden>
        <button id="esc-prev" class="flecha" aria-label="Anterior">&#8249;</button>
        <button id="esc-sig" class="flecha" aria-label="Siguiente">&#8250;</button>
        <div id="esc-marco" class="item desde-abajo" data-lado="izquierda">
          <div id="esc-etiqueta"></div>
          <div id="esc-caja"><p id="esc-texto" aria-live="polite"></p></div>
          <button id="esc-boton" class="boton" hidden></button>
        </div>
      </section>

      <p id="aviso" role="status"></p>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
